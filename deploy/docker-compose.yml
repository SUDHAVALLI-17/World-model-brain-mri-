# Base services. Combine with ONE override:
#   laptop:  docker compose -f docker-compose.yml -f docker-compose.local.yml up -d --build
#   AWS:     docker compose -f docker-compose.yml -f docker-compose.aws.yml --env-file .env up -d --build
services:
  app:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    image: brainwm-app
    environment:
      MODEL_DIR: /srv/models
      COOKIE_SECURE: "1"
      MAX_UPLOAD_MB: "400"
      MAX_JOBS: "1"
    volumes:
      - ../models:/srv/models:ro
    expose:
      - "8000"                 # reachable only from the caddy container, never published
    read_only: true            # container filesystem is immutable
    tmpfs:
      - /tmp:size=3g
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    mem_limit: 6g
    restart: unless-stopped

  caddy:
    image: caddy:2
    depends_on: [app]
    environment:
      DOMAIN: ${DOMAIN:-localhost}
      TLS: ${TLS:-internal}
    ports:
      - "80:80"                # only for Let's Encrypt and the redirect to HTTPS
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    restart: unless-stopped

volumes:
  caddy_data:
  caddy_config:
